<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 互动波浪矩阵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">3D 互动波浪矩阵 - 移动鼠标与立方体交互</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(20, 25, 20);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(20, 30, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);
        
        const pointLight = new THREE.PointLight(0x00aaff, 0.8, 50);
        pointLight.position.set(0, 15, 0);
        scene.add(pointLight);
        
        const gridSize = 15;
        const cubeSize = 0.8;
        const spacing = 1.2;
        const cubes = [];
        const originalPositions = [];
        
        const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        
        for (let i = 0; i < gridSize; i++) {
            for (let j = 0; j < gridSize; j++) {
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0066ff,
                    metalness: 0.3,
                    roughness: 0.4,
                    emissive: 0x001133,
                    emissiveIntensity: 0.2
                });
                
                const cube = new THREE.Mesh(geometry, material);
                
                const x = (i - (gridSize - 1) / 2) * spacing;
                const z = (j - (gridSize - 1) / 2) * spacing;
                
                cube.position.set(x, 0, z);
                cube.castShadow = true;
                cube.receiveShadow = true;
                
                cube.userData = {
                    gridX: i,
                    gridZ: j,
                    baseX: x,
                    baseZ: z,
                    originalScale: 1,
                    targetScale: 1,
                    isHovered: false
                };
                
                cubes.push(cube);
                originalPositions.push({ x, z });
                scene.add(cube);
            }
        }
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredCube = null;
        
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }
        
        window.addEventListener('mousemove', onMouseMove, false);
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.addEventListener('resize', onWindowResize, false);
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubes);
            
            if (hoveredCube && (!intersects.length || intersects[0].object !== hoveredCube)) {
                hoveredCube.userData.isHovered = false;
                hoveredCube.userData.targetScale = 1;
                hoveredCube.material.color.setHex(0x0066ff);
                hoveredCube.material.emissive.setHex(0x001133);
                hoveredCube.material.emissiveIntensity = 0.2;
                hoveredCube = null;
            }
            
            if (intersects.length > 0) {
                const cube = intersects[0].object;
                if (cube !== hoveredCube) {
                    hoveredCube = cube;
                    cube.userData.isHovered = true;
                    cube.userData.targetScale = 1.5;
                    cube.material.color.setHex(0xff3366);
                    cube.material.emissive.setHex(0xff0000);
                    cube.material.emissiveIntensity = 0.5;
                }
            }
            
            for (let i = 0; i < cubes.length; i++) {
                const cube = cubes[i];
                const { baseX, baseZ, isHovered, targetScale } = cube.userData;
                
                const distance = Math.sqrt(baseX * baseX + baseZ * baseZ);
                
                const waveHeight = Math.sin(distance * 0.5 - time * 2) * 2;
                const secondWave = Math.cos(baseX * 0.3 + time * 1.5) * Math.sin(baseZ * 0.3 + time) * 1.5;
                
                let targetY = waveHeight + secondWave;
                
                if (isHovered) {
                    targetY += 2;
                }
                
                cube.position.y += (targetY - cube.position.y) * 0.1;
                
                const currentScale = cube.scale.x;
                const newScale = currentScale + (targetScale - currentScale) * 0.15;
                cube.scale.set(newScale, newScale, newScale);
                
                const hue = (Math.sin(time + distance * 0.1) * 0.5 + 0.5) * 0.1 + 0.55;
                if (!isHovered) {
                    cube.material.color.setHSL(hue, 0.8, 0.5);
                    cube.material.emissive.setHSL(hue, 0.5, 0.1);
                }
            }
            
            pointLight.position.x = Math.sin(time * 0.5) * 10;
            pointLight.position.z = Math.cos(time * 0.5) * 10;
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
